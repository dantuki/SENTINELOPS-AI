
[project]
name = "sentinelops-ai-orchestrator"
version = "0.1.0"
description = "Motor de orquestación e investigación de incidentes de SentinelOps AI."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.143.3,<0.144",
    "langgraph>=1.2.16,<1.3",
    "pydantic>=2.14.1,<2.15",
    "uvicorn[standard]>=0.54.0,<0.55",
]

[project.scripts]
sentinelops-ai-orchestrator = "sentinelops_ai_orchestrator:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
